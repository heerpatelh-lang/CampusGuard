<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="libraryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F3F4F6" />
    </linearGradient>
  </defs>
  <!-- Library Background wall & bookshelf hint -->
  <rect width="400" height="300" fill="url(#libraryBg)" />
  <rect x="20" y="40" width="360" height="110" rx="4" fill="#E2E8F0" />
  <!-- Book spines on shelf -->
  <rect x="35" y="60" width="15" height="80" fill="#EF4444" />
  <rect x="52" y="65" width="12" height="75" fill="#3B82F6" />
  <rect x="66" y="55" width="18" height="85" fill="#10B981" />
  <rect x="86" y="70" width="14" height="70" fill="#F59E0B" />
  <rect x="102" y="60" width="16" height="80" fill="#8B5CF6" />
  <rect x="120" y="65" width="20" height="75" fill="#06B6D4" />
  <rect x="142" y="58" width="14" height="82" fill="#EC4899" />
  
  <!-- Wooden Study Bench with broken leg -->
  <!-- Bench top -->
  <rect x="70" y="180" width="260" height="22" rx="4" fill="#B45309" stroke="#78350F" stroke-width="2" />
  <!-- Bench backrest -->
  <rect x="80" y="140" width="240" height="15" rx="3" fill="#D97706" stroke="#92400E" stroke-width="2" />
  <line x1="100" y1="155" x2="100" y2="180" stroke="#78350F" stroke-width="4" />
  <line x1="200" y1="155" x2="200" y2="180" stroke="#78350F" stroke-width="4" />
  <line x1="300" y1="155" x2="300" y2="180" stroke="#78350F" stroke-width="4" />
  
  <!-- Left Leg (Intact) -->
  <rect x="95" y="202" width="14" height="75" fill="#78350F" />
  <rect x="125" y="202" width="14" height="70" fill="#92400E" />
  <!-- Right Leg (Broken / detached screw) -->
  <g transform="translate(285, 202) rotate(24)">
    <rect x="0" y="0" width="14" height="70" fill="#78350F" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3,2" />
  </g>
  <!-- Fallen screw & warning indicator -->
  <circle cx="288" cy="275" r="4" fill="#94A3B8" stroke="#475569" stroke-width="1" />
  <circle cx="295" cy="210" r="14" fill="#EF4444" opacity="0.2" />
  <circle cx="295" cy="210" r="4" fill="#EF4444" />

  <!-- Tag Banner -->
  <rect x="15" y="15" rx="8" width="190" height="28" fill="rgba(15, 23, 42, 0.75)" />
  <text x="25" y="34" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🪑 Broken Furniture / Item</text>
</svg>
