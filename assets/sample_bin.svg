<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="binBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#binBg)" />
  <line x1="0" y1="260" x2="400" y2="260" stroke="#94A3B8" stroke-width="2" />
  
  <!-- Green Recycle Bin -->
  <g transform="translate(130, 90)">
    <!-- Bin Body -->
    <polygon points="20,70 120,70 110,170 30,170" fill="#10B981" stroke="#047857" stroke-width="3" />
    <!-- Bin Rim -->
    <rect x="15" y="60" width="110" height="15" rx="3" fill="#059669" />
    <!-- Recycling Arrows symbol -->
    <g transform="translate(52, 95) scale(0.6)">
      <path d="M25 5 L35 22 L15 22 Z" fill="#FFFFFF" />
      <path d="M40 30 L50 47 L30 47 Z" fill="#FFFFFF" transform="rotate(120 35 35)" />
      <path d="M10 30 L20 47 L0 47 Z" fill="#FFFFFF" transform="rotate(240 35 35)" />
    </g>

    <!-- Overflowing paper / bottles / cups -->
    <!-- Paper ball 1 -->
    <circle cx="45" cy="50" r="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
    <!-- Plastic bottle -->
    <g transform="translate(70, 30) rotate(25)">
      <rect x="0" y="0" width="16" height="32" rx="3" fill="#38BDF8" opacity="0.8" stroke="#0284C7" stroke-width="1.5" />
      <rect x="4" y="-6" width="8" height="6" fill="#0284C7" />
    </g>
    <!-- Paper sheet spilling over side -->
    <path d="M 95 62 Q 130 75 125 110 Q 110 100 100 85 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" />
    <!-- Coffee / juice cup -->
    <polygon points="25,35 45,35 42,60 28,60" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.5" />
  </g>

  <!-- Spill on floor -->
  <ellipse cx="270" cy="260" rx="35" ry="8" fill="#E2E8F0" />
  <circle cx="275" cy="256" r="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" />

  <!-- Tag Banner -->
  <rect x="15" y="15" rx="8" width="165" height="28" fill="rgba(15, 23, 42, 0.75)" />
  <text x="25" y="34" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">♻️ Litter / Full Bin</text>
</svg>
